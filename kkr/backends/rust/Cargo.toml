[package]
name = "kkr-backend"
version = "0.1.0"
edition = "2021"
authors = ["KKR Team"]
description = "High-performance Rust backend for KKR"
license = "MIT"

[lib]
name = "kkr_backend"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Compression
lz4 = "1.24"
zstd = "0.13"

# HTTP client (for external calls)
reqwest = { version = "0.11", features = ["json", "stream"] }

# Async channels
async-channel = "2.1"
futures = "0.3"

# Memory allocator (better performance)
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "benchmarks"
harness = false

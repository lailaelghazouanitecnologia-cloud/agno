# KKR Configuration
# ==================
# Multi-backend configuration for the KKR framework

app_name: kkr
version: "0.1.0"
environment: development

# Rust Backend Configuration
# --------------------------
# High-performance operations: compression, vectors, batch processing
rust:
  enabled: true
  max_workers: 4
  timeout_ms: 30000
  enable_caching: true
  enable_tracing: false

  # Compression settings
  default_compression: lz4  # lz4 (faster) or zstd (better ratio)
  zstd_level: 3  # 1-22, higher = better compression, slower

  # Vector operations
  vector_normalize: true

# Python Backend Configuration
# ----------------------------
# ML/AI operations: inference, embeddings, complex logic
python:
  enabled: true
  max_workers: 4
  timeout_ms: 60000
  enable_caching: true
  enable_tracing: false

  # Inference settings
  default_model: gpt-4
  embedding_model: text-embedding-ada-002
  max_tokens: 4096
  temperature: 0.7

  # Storage settings
  cache_ttl: 3600  # 1 hour

# Hybrid Mode Configuration
# -------------------------
# Automatic routing between Rust and Python
hybrid:
  enabled: true

  # Operations preferring Rust (performance-critical)
  prefer_rust_for:
    - compression
    - decompression
    - vector_ops
    - batch_processing
    - parallel_compute
    - binary_operations

  # Operations preferring Python (flexibility-critical)
  prefer_python_for:
    - inference
    - embeddings
    - ml_ops
    - complex_logic
    - api_integrations
    - data_processing

  # Fallback if preferred backend unavailable
  fallback_to_python: true

# Logging Configuration
# ---------------------
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null  # Optional: logs/kkr.log
  enable_json: false

# Feature Flags
# -------------
features:
  enable_metrics: true
  enable_tracing: false
  enable_profiling: false
  enable_caching: true

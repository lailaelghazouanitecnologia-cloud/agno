[workspace]
resolver = "2"
members = [
    "crates/descriptor",
    "crates/generator",
    "crates/differ",
    "crates/processor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

# Internal
roska-descriptor = { path = "crates/descriptor" }
roska-generator = { path = "crates/generator" }
roska-differ = { path = "crates/differ" }
roska-processor = { path = "crates/processor" }

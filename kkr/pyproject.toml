[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kkr"
version = "0.1.0"
description = "Multi-backend agent framework with Rust and Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "KKR Team"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Full installation with all backends
all = [
    "kkr[python]",
    "kkr[rust]",
]

# Python backend dependencies
python = [
    "numpy>=1.24",
    "httpx>=0.25",
    "asyncio>=3.4",
]

# Rust backend (requires building)
rust = [
    "maturin>=1.4",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "black>=23.0",
]

# ML/AI dependencies
ml = [
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
]

[project.urls]
Homepage = "https://github.com/kkr-framework/kkr"
Documentation = "https://kkr.dev/docs"
Repository = "https://github.com/kkr-framework/kkr"

[project.scripts]
kkr = "kkr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kkr*"]

[tool.setuptools.package-data]
kkr = ["*.yaml", "*.yml"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

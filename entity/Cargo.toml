[workspace]
resolver = "2"
members = [
    "crates/entity-core",
    "crates/entities/entity-descriptor",
    "crates/entities/entity-planner",
    "crates/entities/entity-coder",
    "crates/entity-tools",
    "crates/entity-context",
    "crates/entity-session",
    "crates/entity-safety",
    "crates/entity-runner",
    "crates/entity-cli",
    # Memory & Knowledge
    "crates/entity-memory",
    "crates/entity-embedder",
    "crates/entity-vectordb",
    "crates/entity-knowledge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
glob = "0.3"
regex = "1"
crossterm = "0.27"
reqwest = { version = "0.11", features = ["json"] }
tokio-rusqlite = "0.6"
common-error = { path = "../common/crates/common-error" }
common-traits = { path = "../common/crates/common-traits" }
common-config = { path = "../common/crates/common-config" }
common-serde = { path = "../common/crates/common-serde" }
roska-descriptor = { path = "../roska/crates/descriptor" }
roska-generator = { path = "../roska/crates/generator" }
roska-differ = { path = "../roska/crates/differ" }
roska-processor = { path = "../roska/crates/processor" }
entity-core = { path = "crates/entity-core" }
entity-descriptor = { path = "crates/entities/entity-descriptor" }
entity-planner = { path = "crates/entities/entity-planner" }
entity-coder = { path = "crates/entities/entity-coder" }
entity-tools = { path = "crates/entity-tools" }
entity-context = { path = "crates/entity-context" }
entity-session = { path = "crates/entity-session" }
entity-safety = { path = "crates/entity-safety" }
entity-runner = { path = "crates/entity-runner" }
entity-cli = { path = "crates/entity-cli" }
entity-memory = { path = "crates/entity-memory" }
entity-embedder = { path = "crates/entity-embedder" }
entity-vectordb = { path = "crates/entity-vectordb" }
entity-knowledge = { path = "crates/entity-knowledge" }

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/runtime",
    "crates/workflow",
    "crates/providers/anthropic",
    "crates/providers/groq",
    "crates/providers/openai",
    "crates/providers/google",
    "crates/providers/ollama",
    "crates/providers/mistral",
    "crates/tools/fs",
    "crates/tools/git",
    "crates/tools/shell",
    "crates/tools/http",
    "crates/tools/json",
    "crates/tools/regex",
    "crates/tools/time",
    "crates/tools/math",
    "crates/tools/search",
    "crates/tools/github",
    "crates/tools/arxiv",
    "crates/tools/neo4j",
    "crates/tools/email",
    "crates/tools/discord",
    "crates/tools/finance",
    "crates/tools/youtube",
    "crates/tools/duckdb",
    "crates/embedders",
    "crates/vectordb",
    "crates/mcp",
    "crates/knowledge",
    "crates/memory",
    "crates/sdk/guardrails",
    "crates/sdk/tendencies",
    "crates/bindings/python",
    "crates/bindings/node",
    # Project Intelligence System
    "crates/ast",
    "crates/graph",
    "crates/errordb",
    "crates/project",
    "crates/coordinator",
    "crates/refactor",
    # VM + Plan (new architecture)
    "crates/vm",
    "crates/plan",
    "examples/kkr-agent-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kkr-framework/kkr"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Channels
async-channel = "2.1"
crossbeam-channel = "0.5"

# Regex
regex = "1.10"

# TOML
toml = "0.8"

# Internal crates
kkr-core = { path = "crates/core" }
kkr-runtime = { path = "crates/runtime" }
kkr-workflow = { path = "crates/workflow" }
kkr-ast = { path = "crates/ast" }
kkr-graph = { path = "crates/graph" }
kkr-errordb = { path = "crates/errordb" }
kkr-project = { path = "crates/project" }
kkr-coordinator = { path = "crates/coordinator" }
kkr-refactor = { path = "crates/refactor" }
kkr-vm = { path = "crates/vm" }
kkr-plan = { path = "crates/plan" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
resolver = "2"
members = [
    "crates/entity-core",
    "crates/entity-descriptor",
    "crates/entity-planner",
    "crates/entity-coder",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
common-error = { path = "../common/crates/common-error" }
common-traits = { path = "../common/crates/common-traits" }
common-config = { path = "../common/crates/common-config" }
common-serde = { path = "../common/crates/common-serde" }
roska-descriptor = { path = "../roska/crates/descriptor" }
roska-generator = { path = "../roska/crates/generator" }
roska-differ = { path = "../roska/crates/differ" }
roska-processor = { path = "../roska/crates/processor" }
entity-core = { path = "crates/entity-core" }
entity-descriptor = { path = "crates/entity-descriptor" }
entity-planner = { path = "crates/entity-planner" }
entity-coder = { path = "crates/entity-coder" }
